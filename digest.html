<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>每日收录库 · GitHub 项目速递</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--border:#e5e7eb;--text:#1f2328;--muted:#6b7280;
  --accent:#2f6feb;--accent-weak:#e8f0fe;--radius:10px;--shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216;--card:#171b21;--border:#2a313a;--text:#e6e8eb;--muted:#9aa3ad;
    --accent:#6ea1ff;--accent-weak:#1d2a45;--shadow:none;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:960px;margin:0 auto;padding:16px 14px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.top h1{font-size:21px}
.top .meta{color:var(--muted);font-size:13px;margin-top:3px}
.nav{display:flex;gap:6px}
.nav a{padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:600;
  border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav a.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;display:grid;grid-template-columns:1fr 140px 120px 120px 120px;gap:10px;margin-bottom:10px}
input,select,button{border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13.5px;
  width:100%;font-family:inherit;background:var(--card);color:var(--text)}
.chk-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.chk-row label{display:flex;align-items:center;gap:5px}
.chk-row input{width:auto}
.stat{font-size:13px;color:var(--muted);margin:2px 2px 10px}
.stat b{color:var(--text)}
.new-pill{display:inline-block;background:#d93025;color:#fff;font-size:11px;font-weight:700;
  border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.pin-pill{background:#f59e0b;color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.pinned{border-color:#f59e0b}
.title-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.title{font-size:16px;font-weight:700;word-break:break-all}
.summary{font-size:13.5px;color:var(--muted);margin-bottom:9px}
.note-line{font-size:12.5px;background:var(--accent-weak);color:var(--accent);
  border-radius:7px;padding:6px 9px;margin-bottom:8px}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.meta .star{color:#d4a017;font-weight:600}
.chip{font-size:11.5px;padding:2px 9px;border-radius:11px;font-weight:600;
  background:var(--accent-weak);color:var(--accent);white-space:nowrap}
.chip.gray{background:var(--bg);color:var(--muted)}
.mini-btn{border:1px solid var(--border);width:auto;padding:3px 9px;font-size:12px;border-radius:6px;
  cursor:pointer;background:transparent;color:var(--accent)}
.mini-btn.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
.rate-mini{border:none;width:auto;padding:0;font-size:13px;cursor:pointer;background:transparent}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:46px 16px;
  background:var(--card);border:1px dashed var(--border);border-radius:var(--radius)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#333;color:#fff;
  padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.show{opacity:.95}
/* 看板 */
.dash{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:14px}
.dash h3{font-size:14px;margin-bottom:10px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.dash-cell{background:var(--bg);border-radius:8px;padding:9px 11px}
.dash-cell .n{font-size:19px;font-weight:700}
.dash-cell .l{font-size:12px;color:var(--muted)}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px}
.bar-row .bar{height:8px;background:var(--accent);border-radius:4px;min-width:3px}
.hl{font-size:11.5px;padding:2px 9px;border-radius:11px;font-weight:700;color:#fff;white-space:nowrap}
.hl-ok{background:#188038}.hl-warn{background:#f59e0b}.hl-stop{background:#9aa3ad}
.spark{display:inline-block;vertical-align:middle}
.review-line{font-size:12.5px;background:var(--accent-weak);color:var(--accent);
  border-radius:7px;padding:7px 10px;margin:8px 0}
.vel{color:#d4a017;font-weight:600}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.word-cloud{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline}
.word-cloud .w{cursor:pointer;color:var(--accent);line-height:1.2}
.word-cloud .w:hover{text-decoration:underline}
@media (max-width:640px){
  .wrap{padding:10px}
  .filters{grid-template-columns:1fr 1fr;gap:7px}
  .card{padding:11px}
  .title{font-size:15px}
  .nav{gap:12px;font-size:13px}
  .mini-btn{padding:5px 9px;font-size:12px}
  .meta{gap:8px;font-size:12px}
}
@media (max-width:640px){.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>GitHub 每日收录库</h1>
      <div class="meta" id="metaLine">加载中…</div>
    </div>
    <div class="nav">
      <a href="index.html">项目搜索</a>
      <a href="digest.html" class="active">收录库</a>
    </div>
  </div>

  <div id="dashBox" hidden>
    <div class="dash">
      <h3>收录健康度看板</h3>
      <div class="dash-grid" id="dashGrid"></div>
      <h3 style="margin-top:14px">分类分布</h3>
      <div id="dashCats"></div>
    </div>
  </div>

  <div id="cloudBox" hidden>
    <div class="dash">
      <h3>热词趋势云（点击词即搜索）</h3>
      <div id="wordCloud" class="word-cloud"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="mini-btn" id="cloudToggle">热词云</button>
    <button class="mini-btn" id="exportJsonBtn">导出JSON</button>
    <button class="mini-btn" id="exportCsvBtn">导出CSV</button>
  </div>

  <div class="filters">
    <input id="kw" placeholder="搜索标题 / 简介 / 标签…">
    <select id="catSel"><option value="">全部分类</option></select>
    <select id="platSel"><option value="">全部平台</option></select>
    <select id="licSel"><option value="">全部许可证</option></select>
    <select id="groupSel"><option value="">全部分组</option><option value="__pinned">仅看置顶</option></select>
  </div>
  <div class="filters" style="grid-template-columns:repeat(3,1fr)">
    <select id="sortSel">
      <option value="new">最新收录</option>
      <option value="star">星标最多</option>
      <option value="update">最近更新</option>
      <option value="rating">我的评分</option>
      <option value="health">健康度</option>
      <option value="velocity">星标增速</option>
    </select>
    <button class="mini-btn" id="dashToggle" style="width:100%">健康看板</button>
    <button class="mini-btn" id="addGroupBtn" style="width:100%">新建分组</button>
  </div>
  <div class="chk-row">
    <label><input type="checkbox" id="fNewbie">新手友好（有未关闭 issue）</label>
    <label><input type="checkbox" id="fCn">中文相关</label>
    <label><input type="checkbox" id="fReview">显示中文点评</label>
  </div>

  <div class="stat" id="statLine"></div>
  <div id="list"></div>
</div>
<div id="toast"></div>

<script>
(function(){
"use strict";
var ALL=[],LATEST="",META={},GROUPS=[];
var LS_META="ghpf_dg_meta_v1",LS_GROUP="ghpf_dg_groups_v1";
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");
  setTimeout(function(){t.classList.remove("show")},1700)}
function loadMeta(){
  try{META=JSON.parse(localStorage.getItem(LS_META)||"{}")}catch(e){META={}}
  try{GROUPS=JSON.parse(localStorage.getItem(LS_GROUP)||"[]")}catch(e){GROUPS=[]}
}
function saveMeta(){localStorage.setItem(LS_META,JSON.stringify(META))}
function gm(id){return META[id]||{}}          // 只读，不创建空条目
function m(id){return META[id]||(META[id]={})} // 变更时使用
function hasCjk(s){return /[\u4e00-\u9fff]/.test(s||"")}

/* ===== 洞察：星标历史 / 健康评分 / 中文点评 ===== */
var HIST={};
var AUDIENCE={
 "硬件固件":"适合做嵌入式、物联网和硬件改造的开发者",
 "逆向开发":"适合安全研究、逆向分析和固件调试人员",
 "AI&Agent":"适合搭建大模型应用、智能体和 RAG 工作流的开发者",
 "影音播放器":"适合需要本地音视频播放与媒体处理的用户",
 "NAS存储":"适合自建 NAS、家庭存储和私有云的用户",
 "游戏":"适合游戏开发、模拟器和游戏模组爱好者",
 "设计":"适合设计师和需要绘图、创意工具的用户",
 "系统工具":"适合系统运维、效率增强和桌面工具用户",
 "效率工具":"适合想提升日常办公与自动化效率的用户"};
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function velOf(p){
  var pts=HIST[p.id];
  if(!pts||pts.length<2)return null;
  pts=pts.slice().sort(function(x,y){return x.date<y.date?-1:1});
  var days=Math.max(1,daysBetween(pts[0].date,pts[pts.length-1].date));
  return Math.round((pts[pts.length-1].star-pts[0].star)/days*100)/100;
}
function healthOf(p){
  var score=0;
  var ref=String(p.last_commit||p.pushed_at||"").slice(0,10);
  var age=ref?daysBetween(ref,new Date()):99999;
  if(age<=30)score+=40;else if(age<=90)score+=30;else if(age<=180)score+=20;
  else if(age<=365)score+=10;
  var star=p.star||0;
  if(star>=500)score+=20;else if(star>=100)score+=14;else if(star>=50)score+=8;else if(star>=10)score+=4;
  var oi=p.open_issues||0;
  if(oi>20)score+=15;else if(oi>0)score+=10;
  var v=velOf(p);
  if(v!==null){if(v>=5)score+=25;else if(v>=1)score+=17;else score+=9;}else score+=8;
  if(p.is_archived)score=Math.min(score,20);
  score=Math.max(0,Math.min(100,score));
  var label=score>=70?"健康":score>=40?"放缓":"停滞";
  return {score:score,label:label};
}
function reviewOf(p){
  var h=healthOf(p),cats=p.category_tags||[],cat=cats[0]||"效率工具";
  var lang=p.language||"多语言",lic=p.license||"",star=p.star||0;
  var s="这是一个「"+cat+"」方向的 "+lang+" 项目；目前 "+star+
    " 星，活跃度评估为「"+h.label+"」（"+h.score+" 分）；";
  s+=lic?("采用 "+lic+" 协议，可按协议使用；"):"未标注开源协议，商用前需先确认授权；";
  return s+(AUDIENCE[cat]||"适合关注该方向的开发者")+"。";
}
function spark(p){
  var pts=HIST[p.id];
  if(!pts||pts.length<2)return "";
  pts=pts.slice().sort(function(x,y){return x.date<y.date?-1:1});
  var W=72,H=24,stars=pts.map(function(x){return x.star});
  var min=Math.min.apply(null,stars),max=Math.max.apply(null,stars),span=(max-min)||1;
  var xy=pts.map(function(x,i){
    var px=Math.round(i/(pts.length-1)*W);
    var py=H-2-Math.round((x.star-min)/span*(H-4));
    return px+","+py;
  }).join(" ");
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+
    '"><polyline points="'+xy+'" fill="none" stroke="#d4a017" stroke-width="1.5"/></svg>';
}

function boot(d,h){
  HIST=h||{};
  ALL=(d.projects||[]).filter(function(p){return!p.is_hidden});
  LATEST=ALL.map(function(p){return p.crawl_date}).sort().pop()||"";
  var meta=d.meta||{};
  var newest=ALL.filter(function(p){return p.crawl_date===LATEST}).length;
  $("metaLine").innerHTML="共 "+ALL.length+" 个收录项目 · 更新于 "+
    (meta.updated_at||LATEST)+' <span class="new-pill">最新收录日 '+newest+' 条</span>';
  loadMeta();fillOptions();render();renderDashboard();
}
Promise.all([
  fetch("data/projects.json",{cache:"no-store"}).then(function(r){return r.json()}),
  fetch("data/star_history.json",{cache:"no-store"})
    .then(function(r){return r.ok?r.json():{history:{}}})
    .catch(function(){return {history:{}}})
]).then(function(res){
  boot(res[0],(res[1]||{}).history||{})
}).catch(function(e){
  $("metaLine").textContent="数据加载失败："+e.message;
  $("list").innerHTML='<div class="empty">无法加载 data/projects.json</div>';
});

function uniq(key){
  var s={};ALL.forEach(function(p){(p[key]||[]).forEach(function(v){s[v]=1})});
  return Object.keys(s).sort();
}
function fillOptions(){
  uniq("category_tags").forEach(function(v){var o=document.createElement("option");
    o.value=v;o.textContent=v;$("catSel").appendChild(o)});
  uniq("platform_tags").forEach(function(v){var o=document.createElement("option");
    o.value=v;o.textContent=v;$("platSel").appendChild(o)});
  var lics={};ALL.forEach(function(p){lics[p.license||"未知"]=1});
  Object.keys(lics).sort().forEach(function(v){var o=document.createElement("option");
    o.value=v==="未知"?"":v;o.textContent=v;$("licSel").appendChild(o)});
  fillGroupSel();
}
function fillGroupSel(){
  var sel=$("groupSel");
  while(sel.options.length>2)sel.remove(2);
  GROUPS.forEach(function(g){var o=document.createElement("option");o.value=g;o.textContent=g;sel.appendChild(o)});
}

function render(){
  var kw=$("kw").value.trim().toLowerCase(),cat=$("catSel").value,
      plat=$("platSel").value,lic=$("licSel").value,grp=$("groupSel").value,
      sort=$("sortSel").value;
  var list=ALL.filter(function(p){
    if(cat&&(p.category_tags||[]).indexOf(cat)<0)return false;
    if(plat&&(p.platform_tags||[]).indexOf(plat)<0)return false;
    if(lic&&(p.license||"")!==lic)return false;
    if(grp==="__pinned"&&!gm(p.id).pin)return false;
    if(grp&&grp!=="__pinned"&&gm(p.id).group!==grp)return false;
    if($("fNewbie").checked&&!(p.open_issues>0))return false;
    if($("fCn").checked&&!(hasCjk(p.title)||hasCjk(p.summary)))return false;
    if(kw){var hay=(p.title+" "+p.summary+" "+(p.category_tags||[]).join(" ")).toLowerCase();
      if(hay.indexOf(kw)<0)return false}
    return true;
  });
  list.sort(function(a,b){
    if(sort==="star")return(b.star||0)-(a.star||0);
    if(sort==="update")return String(b.last_commit).localeCompare(String(a.last_commit));
    if(sort==="rating")return(gm(b.id).rating||0)-(gm(a.id).rating||0);
    if(sort==="health")return healthOf(b).score-healthOf(a).score;
    if(sort==="velocity"){
      var va=velOf(b),vb=velOf(a);
      return (va==null?-1:va)-(vb==null?-1:vb);
    }
    return String(b.crawl_date).localeCompare(String(a.crawl_date));
  });
  // 置顶优先
  list.sort(function(a,b){return(!!gm(b.id).pin)-(!!gm(a.id).pin)});
  $("statLine").innerHTML="显示 <b>"+list.length+"</b> / "+ALL.length+" 个项目";
  if(!list.length){$("list").innerHTML='<div class="empty">没有符合条件的项目</div>';return}
  $("list").innerHTML=list.map(function(p){
    var mm=gm(p.id);
    var cats=(p.category_tags||[]).map(function(t){return'<span class="chip">'+esc(t)+"</span>"}).join("");
    var plats=(p.platform_tags||[]).map(function(t){return'<span class="chip gray">'+esc(t)+"</span>"}).join("");
    var isNew=p.crawl_date===LATEST?'<span class="new-pill" style="margin:0">新</span>':"";
    var pin='<button class="mini-btn '+(mm.pin?"on":"")+'" data-act="pin" data-id="'+esc(p.id)+'">置顶</button>';
    var stars=[1,2,3,4,5].map(function(n){return'<button class="rate-mini" data-act="rate" data-id="'+
      esc(p.id)+'" data-v="'+n+'">'+(n<=(mm.rating||0)?"★":"☆")+"</button>"}).join("");
    var gsel='<select data-act="group" data-id="'+esc(p.id)+'" style="width:auto;padding:3px 6px;font-size:12px">'+
      '<option value="">未分组</option>'+GROUPS.map(function(g){return'<option '+(mm.group===g?"selected":"")+'>'+esc(g)+"</option>"}).join("")+"</select>";
    var note=mm.note?'<div class="note-line">备注：'+esc(mm.note)+"</div>":"";
    var h=healthOf(p),hlClass=h.label==="健康"?"hl-ok":h.label==="放缓"?"hl-warn":"hl-stop";
    var hl='<span class="hl '+hlClass+'">'+h.label+" "+h.score+"</span>";
    var v=velOf(p),vTxt=v!==null?'<span class="vel">日均 +'+v+" ★</span>":"";
    var sp=spark(p);
    var review=$("fReview").checked?'<div class="review-line">'+esc(reviewOf(p))+"</div>":"";
    return '<div class="card '+(mm.pin?"pinned":"")+'"><div class="title-line">'
      +'<a class="title" href="'+esc(p.github_url)+'" target="_blank" rel="noopener">'+esc(p.title)+"</a>"
      +isNew+hl+cats+plats+"</div>"
      +(p.summary?'<div class="summary">'+esc(p.summary)+"</div>":"")
      +note+review
      +'<div class="meta"><span class="star">★ '+Number(p.star||0).toLocaleString()+"</span>"
      +vTxt+sp+"<span>更新 "+esc(p.last_commit)+"</span>"+pin+gsel
      +'<button class="mini-btn" data-act="note" data-id="'+esc(p.id)+'">备注</button>'
      +'<button class="mini-btn" data-act="share" data-id="'+esc(p.id)+'">分享</button>'
      +"</div><div class='meta' style='margin-top:7px'>评分："+stars+"</div></div>";
  }).join("");
}

function renderDashboard(){
  var total=ALL.length;
  var pinned=ALL.filter(function(p){return gm(p.id).pin}).length;
  var rated=ALL.filter(function(p){return gm(p.id).rating}).length;
  var withIss=ALL.filter(function(p){return p.open_issues>0}).length;
  var hc={"健康":0,"放缓":0,"停滞":0},scoreSum=0;
  ALL.forEach(function(p){var h=healthOf(p);hc[h.label]++;scoreSum+=h.score});
  var cells=[["项目总数",total],["置顶",pinned],["已评分",rated],["新手友好",withIss],
    ["健康",hc["健康"]],["放缓",hc["放缓"]],["停滞",hc["停滞"]],
    ["平均健康分",Math.round(scoreSum/total)],
    ["分类数",uniq("category_tags").length],["平台数",uniq("platform_tags").length]];
  $("dashGrid").innerHTML=cells.map(function(c){return'<div class="dash-cell"><div class="n">'+c[1]
    +'</div><div class="l">'+c[0]+"</div></div>"}).join("");
  var cc={};ALL.forEach(function(p){(p.category_tags||[]).forEach(function(t){cc[t]=(cc[t]||0)+1})});
  var max=Math.max.apply(null,Object.keys(cc).map(function(k){return cc[k]}).concat([1]));
  $("dashCats").innerHTML=Object.keys(cc).sort(function(a,b){return cc[b]-cc[a]}).map(function(k){
    var w=Math.round(cc[k]/max*160);
    return '<div class="bar-row"><span style="width:78px">'+esc(k)+"</span><div class='bar' style='width:"
      +w+"px'></div><span>"+cc[k]+"</span></div>"}).join("");
}

function share(p){
  var payload={title:p.title,text:"推荐一个 GitHub 项目："+p.title,url:p.github_url};
  if(navigator.share){navigator.share(payload).catch(function(){});return}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(p.github_url).then(function(){toast("链接已复制")})
  }else{toast(p.github_url)}
}

/* ===== 热词云 ===== */
var STOP_WORDS={the:"1",a:"1",an:"1",and:"1",or:"1",of:"1",to:"1",for:"1",with:"1",
  in:"1",on:"1",is:"1",by:"1",your:"1",you:"1",using:"1",use:"1",based:"1",from:"1",
  /* 网址与仓库名碎片，避免污染热词 */
  http:"1",https:"1",www:"1",com:"1",github:"1",git:"1",io:"1",html:"1",
  api:"1",all:"1",can:"1",that:"1",this:"1",it:"1",as:"1",at:"1",be:"1",
  do:"1",if:"1",not:"1",no:"1",so:"1",we:"1",has:"1",are:"1",was:"1",new:"1"};
function renderCloud(){
  var freq={};
  ALL.forEach(function(p){
    (p.title+" "+(p.summary||"")).toLowerCase()
      .split(/[^a-z0-9一-鿿]+/).forEach(function(w){
      if(!w||w.length<2||STOP_WORDS[w])return;
      freq[w]=(freq[w]||0)+1;
    });
  });
  var arr=Object.keys(freq).map(function(w){return[w,freq[w]]})
    .filter(function(x){return x[1]>=2}).sort(function(a,b){return b[1]-a[1]}).slice(0,60);
  var max=arr.length?arr[0][1]:1;
  $("wordCloud").innerHTML=arr.map(function(x){
    var size=12+Math.round(x[1]/max*16);
    return '<span class="w" style="font-size:'+size+'px" data-w="'+esc(x[0])+'">'
      +esc(x[0])+" <small>"+x[1]+"</small></span>";
  }).join("");
}

/* ===== 导出 ===== */
function download(obj,name,mime){
  var blob=new Blob([obj],{type:mime});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
function csvCell(v){
  v=String(v==null?"":v);
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function exportJson(){
  download(JSON.stringify({projects:ALL,exported_at:new Date().toISOString()},null,2),
    "digest-"+new Date().toISOString().slice(0,10)+".json","application/json");
  toast("已导出 "+ALL.length+" 条 JSON");
}
function exportCsv(){
  var cols=["id","title","summary","github_url","star","last_commit","language",
    "license","open_issues","category_tags","health","review"];
  var rows=[cols.join(",")];
  ALL.forEach(function(p){
    var h=healthOf(p);
    var vals={id:p.id,title:p.title,summary:p.summary,github_url:p.github_url,
      star:p.star,last_commit:p.last_commit,language:p.language,license:p.license,
      open_issues:p.open_issues,category_tags:(p.category_tags||[]).join("|"),
      health:h.label+" "+h.score,review:reviewOf(p)};
    rows.push(cols.map(function(c){return csvCell(vals[c])}).join(","));
  });
  download("﻿"+rows.join("\n"),"digest-"+new Date().toISOString().slice(0,10)+".csv",
    "text/csv;charset=utf-8");
  toast("已导出 "+ALL.length+" 条 CSV");
}

["kw","catSel","platSel","licSel","groupSel","sortSel","fNewbie","fCn","fReview"].forEach(function(id){
  $(id).addEventListener("input",render);
});
$("cloudToggle").addEventListener("click",function(){
  $("cloudBox").hidden=!$("cloudBox").hidden;
  if(!$("cloudBox").hidden)renderCloud();
});
$("exportJsonBtn").addEventListener("click",exportJson);
$("exportCsvBtn").addEventListener("click",exportCsv);
$("wordCloud").addEventListener("click",function(e){
  var w=e.target.closest(".w");if(!w)return;
  $("kw").value=w.getAttribute("data-w");render();
  $("cloudBox").hidden=true;
  window.scrollTo(0,0);toast("已按「"+$("kw").value+"」筛选");
});
$("dashToggle").addEventListener("click",function(){
  $("dashBox").hidden=!$("dashBox").hidden;
  if(!$("dashBox").hidden)renderDashboard();
});
$("addGroupBtn").addEventListener("click",function(){
  var g=prompt("新分组名称：");g=(g||"").trim();
  if(g&&GROUPS.indexOf(g)<0){GROUPS.push(g);localStorage.setItem(LS_GROUP,JSON.stringify(GROUPS));
    fillGroupSel();renderDashboard();toast("已建分组 "+g)}
});
$("list").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var id=b.getAttribute("data-id"),act=b.getAttribute("data-act"),p=ALL.filter(function(x){return x.id===id})[0];
  if(act==="pin"){m(id).pin=!m(id).pin;saveMeta();render();renderDashboard()}
  else if(act==="rate"){m(id).rating=parseInt(b.getAttribute("data-v"),10);saveMeta();render()}
  else if(act==="note"){var n=prompt("写备注：",m(id).note||"");if(n!==null){m(id).note=n;saveMeta();render()}}
  else if(act==="share"){share(p)}
});
$("list").addEventListener("change",function(e){
  var s=e.target.closest('select[data-act="group"]');if(!s)return;
  m(s.getAttribute("data-id")).group=s.value;saveMeta();render();
});
})();
</script>
